# Independent AI review: Claude reviews every Factory Droid PR (branch feature/FF-* or fix/FF-*).
#  - Issues found -> "[AI-REVIEW] CHANGES_REQUESTED" review. The Factory "Ticket to PR" automation
#    picks the feedback up on its next run (step 1: address review comments) and pushes a fix,
#    which triggers a new review.
#  - Clean        -> "[AI-REVIEW] APPROVED" -> ready for human merge.
# Max AI_REVIEW_MAX_ROUNDS (default 3) reviews per PR, then a human takes over.
# Needs the repo secret CLAUDE_CODE_OAUTH_TOKEN (or ANTHROPIC_API_KEY).
# Optional: JIRA_BASE_URL, JIRA_EMAIL, JIRA_API_TOKEN to include the ticket and [AI-PLAN] in the review.
name: AI Claude Review

on:
  pull_request:
    types: [opened, ready_for_review, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to review"
        required: true

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.head.repo.full_name == github.repository)
    concurrency:
      group: ai-claude-review-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      MAX_ROUNDS: ${{ vars.AI_REVIEW_MAX_ROUNDS || '3' }}
      JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
      JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
      JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Decide whether to review
        id: gate
        run: |
          pr="$(gh api "repos/$REPO/pulls/$PR_NUMBER")"
          head="$(jq -r .head.ref <<<"$pr")"
          state="$(jq -r .state <<<"$pr")"; draft="$(jq -r .draft <<<"$pr")"
          go=true
          [[ "$state" == "open" && "$draft" == "false" ]] || go=false
          if [[ ! "$head" =~ ^(feature|fix)/FF-[0-9]+ ]]; then
            echo "::notice::Branch '$head' is not a Factory ticket branch — skipping Claude review."; go=false
          fi
          rounds="$(gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate --jq '[.[] | select(.body | startswith("[AI-REVIEW]"))] | length' | awk '{s+=$1} END {print s+0}')"
          if [[ "$go" == "true" && "$rounds" -ge "$MAX_ROUNDS" ]]; then
            seen="$(gh api "repos/$REPO/issues/$PR_NUMBER/comments" --paginate --jq '[.[] | select(.body | startswith("[AI-REVIEW] Max rounds"))] | length' | awk '{s+=$1} END {print s+0}')"
            [[ "$seen" -eq 0 ]] && gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="[AI-REVIEW] Max rounds ($MAX_ROUNDS) reached — a human reviewer needs to take over this PR." >/dev/null
            go=false
          fi
          {
            echo "go=$go"; echo "rounds=$rounds"; echo "head=$head"
            echo "sha=$(jq -r .head.sha <<<"$pr")"; echo "base=$(jq -r .base.ref <<<"$pr")"
          } >> "$GITHUB_OUTPUT"
          echo "ISSUE_KEY=$(grep -oE 'FF-[0-9]+' <<<"$head" | head -n1)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.go == 'true'
        with:
          ref: ${{ steps.gate.outputs.head }}
          fetch-depth: 0

      - name: Collect review context
        if: steps.gate.outputs.go == 'true'
        env:
          BASE: ${{ steps.gate.outputs.base }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          mkdir -p .ai
          git fetch -q origin "$BASE" "$DEFAULT_BRANCH"
          git diff "origin/$BASE...HEAD" > .ai/diff.patch
          # Use the review instructions from the default branch, not the PR branch.
          git show "origin/$DEFAULT_BRANCH:.github/ai-prompts/review.md" > .ai/instructions.md
          gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '"# \(.title)\n\n\(.body // "")"' > .ai/pr.md
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --paginate \
            --jq '.[] | select(.body | startswith("[AI-REVIEW]")) | "## Review \(.submitted_at)\n\(.body)\n"' > .ai/previous_reviews.md || true
          : > .ai/ticket.md; : > .ai/plan.md
          if [[ -n "$ISSUE_KEY" && -n "$JIRA_BASE_URL" && -n "$JIRA_API_TOKEN" ]]; then
            api="${JIRA_BASE_URL%/}/rest/api/2/issue/$ISSUE_KEY"
            if j="$(curl -fsS -u "$JIRA_EMAIL:$JIRA_API_TOKEN" -H 'Accept: application/json' "$api?fields=summary,description,labels,comment")"; then
              jq -r '"# \(.key): \(.fields.summary)\nLabels: \((.fields.labels // []) | join(", "))\n\n## Description\n\(.fields.description // "(none)")"' <<<"$j" > .ai/ticket.md
              jq -r '[(.fields.comment.comments // [])[] | .body | select(type == "string" and startswith("[AI-PLAN]"))] | last // empty' <<<"$j" > .ai/plan.md
            else
              echo "::warning::Could not read $ISSUE_KEY from Jira — reviewing from the PR description only."
            fi
          fi
          echo "::notice title=Review context::$(wc -l < .ai/diff.patch) diff lines, ticket=${ISSUE_KEY:-none}, round $(( ${{ steps.gate.outputs.rounds }} + 1 ))"

      - name: Claude reviews the PR
        id: claude
        if: steps.gate.outputs.go == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: >-
            --max-turns 40
            --allowedTools "Read,Glob,Grep,Write,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(ls:*)"
          prompt: |
            Read the file .ai/instructions.md and follow its instructions exactly.

      - name: Post the review
        if: steps.gate.outputs.go == 'true'
        env:
          SHA: ${{ steps.gate.outputs.sha }}
          ROUNDS: ${{ steps.gate.outputs.rounds }}
          EXE: ${{ steps.claude.outputs.execution_file }}
        run: |
          f=.ai/review.json
          if [[ -f "$f" ]] && ! jq -e '.verdict' "$f" >/dev/null 2>&1; then
            sed -n '/^[[:space:]]*{/,/^[[:space:]]*}[[:space:]]*$/p' "$f" > .ai/clean.json && mv .ai/clean.json "$f"
          fi
          if ! jq -e '.verdict' "$f" >/dev/null 2>&1 && [[ -f "$EXE" ]]; then
            jq -r '[.[] | select(.type=="result")] | last | .result // ""' "$EXE" \
              | sed -n '/^[[:space:]]*{/,/^[[:space:]]*}[[:space:]]*$/p' > "$f" || true
          fi
          if ! jq -e '.verdict' "$f" >/dev/null 2>&1; then
            echo "::error title=Review::Claude did not produce a valid .ai/review.json"; exit 1
          fi
          verdict="$(jq -r .verdict "$f")"
          round=$(( ROUNDS + 1 ))
          if [[ "$verdict" == "changes" ]]; then tag="[AI-REVIEW] CHANGES_REQUESTED"; else tag="[AI-REVIEW] APPROVED"; fi
          {
            echo "$tag — round $round of $MAX_ROUNDS (reviewer: Claude)"
            echo
            jq -r .summary "$f"
            echo
            if [[ "$(jq '.issues | length' "$f")" -gt 0 ]]; then
              echo "### Issues"
              jq -r '.issues[] | "- **[\(.severity)]** `\(.path)\(if .line then ":\(.line)" else "" end)` — **\(.title)**: \(.detail)"' "$f"
              echo
            fi
            if [[ "$verdict" == "changes" ]]; then
              echo "_Factory Droid: please fix the blocker/major issues above on this branch and push (Ticket to PR step 1). A new review runs after the push._"
            else
              echo "_No blocking issues. Ready for human review and merge._"
            fi
          } > .ai/review_body.md
          jq -n --rawfile body .ai/review_body.md --arg sha "$SHA" '{event:"COMMENT", body:$body, commit_id:$sha}' \
            | gh api "repos/$REPO/pulls/$PR_NUMBER/reviews" --input - > /dev/null
          echo "::notice title=Review posted::$tag (round $round)"

      - name: Report failure on the PR
        if: failure() && steps.gate.outputs.go == 'true'
        run: |
          gh api "repos/$REPO/issues/$PR_NUMBER/comments" -f body="[AI-REVIEW] Failed — the Claude review run did not complete. Logs: $RUN_URL" > /dev/null || true
